<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Djamal Eddine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/webgl-fluid@0.3"></script>
</head>
<body>

<!-- Reusable SVG filter: warps whatever is behind an element (feTurbulence +
     feDisplacementMap) to fake the wavy refraction of thick glass/ice. Used
     via backdrop-filter: url(#glass-distortion) on the nav dock. -->
<svg width="0" height="0" style="position:absolute;overflow:hidden">
  <filter id="glass-distortion" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.009 0.045" numOctaves="2" seed="9" result="noise"/>
    <feGaussianBlur in="noise" stdDeviation="2.8" result="softNoise"/>
    <feDisplacementMap in="SourceGraphic" in2="softNoise" scale="78" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</svg>

<canvas id="fluidCanvas" class="fluid-canvas"></canvas>

<nav class="topnav">
  <div class="brand" id="brandLink" role="button" tabindex="0" aria-label="Back to welcome page">Djamal Eddine</div>
</nav>

<main class="stage" id="stage">

  <!-- small persistent header, shown only once a conversation starts —
       avatar only, no name, so it reads as "you're talking to him" -->
  <div class="chat-header" id="chatHeader" role="button" tabindex="0" aria-label="Back to welcome page">
    <img src="assets/images/avatar0.jpg" class="chat-header-avatar" alt="Djamal Eddine">
  </div>

  <div class="center-col" id="centerCol">
    <div class="greeting">Hey, I'm Djamal <span class="wave">👋</span></div>
    <h1 class="identity">Security &amp; IoT<br>Engineer</h1>
    <div class="avatar-wrap" id="avatarWrap">
      <div class="avatar-ring"></div>
      <img src="assets/images/avatar0.jpg" class="avatar-img" id="avatarImg" alt="Djamal Eddine">
    </div>
  </div>

  <div class="conversation" id="conversation">
    <div class="messages" id="messages"></div>
  </div>

  <div class="composer" id="composer">
    <div class="glass-wrap input-glass-wrap">
      <div class="input-row">
        <input id="chatInput" type="text" placeholder="Ask me anything..." autocomplete="off">
        <button id="sendBtn" aria-label="Send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 12h16M13 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
    <div class="glass-wrap dock-glass-wrap">
      <div class="pill-row" id="pillRow">
        <button class="pill" data-q="Tell me about yourself — who are you?">
          <img class="pill-icon" src="assets/images/icons/icon-me.png" alt=""><span class="pill-label">Me</span>
        </button>
        <button class="pill" data-q="What have you built? Tell me about your projects.">
          <img class="pill-icon" src="assets/images/icons/icon-projects.png" alt=""><span class="pill-label">Projects</span>
        </button>
        <button class="pill" data-q="What are your skills and certifications?">
          <img class="pill-icon" src="assets/images/icons/icon-skills.png" alt=""><span class="pill-label">Skills</span>
        </button>
        <button class="pill" data-q="Tell me something fun about you, outside of work.">
          <img class="pill-icon" src="assets/images/icons/icon-fun.png" alt=""><span class="pill-label">Fun</span>
        </button>
        <button class="pill" id="contactPill">
          <img class="pill-icon" src="assets/images/icons/icon-contact.png" alt=""><span class="pill-label">Contact</span>
        </button>
      </div>
    </div>
  </div>

</main>

<script src="assets/js/fluid-init.js"></script>
<script src="assets/js/chat.js"></script>
</body>
</html>
